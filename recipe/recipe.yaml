context:
  name: acts
  version: "48.5.0"

recipe:
  name: ${{ name }}-suite
  version: ${{ version }}

source:
  url: https://github.com/acts-project/acts/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f13781c4f8420eecf498952ea101100d23fed34fb0f5ad96a4f15c9475b0139b

build:
  number: 1
  skip:
    - win
    # ACTS needs C++23, so only build against the C++23 builds of ROOT
    - root_cxx_standard != "23"

outputs:
  # Build ACTS once with the plugins, then split the installation into the
  # core library and one package per plugin
  - staging:
      name: ${{ name|lower }}-build
    build:
      script:
        # due to https://github.com/conda-forge/z5py-feedstock/issues/24 and
        # PR https://github.com/conda-forge/z5py-feedstock/commit/5fbcb9220d468f0e8f90dd39f3fbb7427dfc5e88
        - if: osx
          then: export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY"
        # ACTS_USE_SYSTEM_LIBS is to avoid ACTS installing with uv
        - cmake ${CMAKE_ARGS} -DCMAKE_INSTALL_PREFIX=${PREFIX} -DACTS_USE_SYSTEM_LIBS=ON -DACTS_BUILD_PLUGIN_ROOT=ON -S . -B build
        - cmake -LH build
        - cmake --build build --parallel=${CPU_COUNT}
        - cmake --install build
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - make
        # Python needed to build codegen components in the build and
        # Fatras/scripts/generate_particle_data_table.py, it is NOT used
        # in the library build itself, so can just select a single Python.
        # c.f. https://github.com/acts-project/acts/blob/d039b6d741bc145ab265e3c4537db07f6ac896d4/codegen/README.md#L3-L4
        - python 3.13.*
        - hatchling
        - numpy
        - sympy
        - particle
      host:
        - libboost-devel
        - eigen
        - root_base
        - root_cxx_standard

  - package:
      name: ${{ name|lower }}-core
    inherit: ${{ name|lower }}-build
    build:
      files:
        include:
          - "**"
        exclude:
          - lib/libActsPluginRoot*
          - include/ActsPlugins/Root/**
          - lib/cmake/Acts/ActsPluginRoot*.cmake
    # The core library doesn't use ROOT. It is built once per ROOT variant
    # together with the plugins, which pin it exactly.
    requirements:
      ignore_run_exports:
        from_package:
          - root_base
          - root_cxx_standard

    tests:
      - package_contents:
          files:
            - lib/cmake/Acts/ActsConfigVersion.cmake
            - lib/cmake/Acts/ActsConfig.cmake
            - lib/cmake/Acts/Modules/FindFastJet.cmake
            - lib/cmake/Acts/Modules/FindPythia8.cmake
            - lib/cmake/Acts/Modules/FindSphinx.cmake
            - lib/cmake/Acts/Modules/FindTBB.cmake
            - lib/cmake/Acts/Modules/FindTensorRT.cmake
            - lib/cmake/Acts/Modules/FindZSTD.cmake
            - lib/cmake/Acts/Modules/Findonnxruntime.cmake
            - lib/cmake/Acts/ActsCoreTargets.cmake
            - lib/cmake/Acts/ActsCoreDependencies.cmake
          include:
            - Acts/*
          lib:
            - ActsCore
          bin:
            - this_acts.sh
            - this_acts_withdeps.sh

  - package:
      name: ${{ name|lower }}-plugin-root
    inherit: ${{ name|lower }}-build
    build:
      string: cxx${{ root_cxx_standard }}_h${{ hash }}_${{ build_number }}
      files:
        - lib/libActsPluginRoot*
        - include/ActsPlugins/Root/**
        - lib/cmake/Acts/ActsPluginRoot*.cmake
    requirements:
      host:
        - root_base
        - root_cxx_standard
      run:
        - ${{ pin_subpackage(name|lower ~ '-core', exact=True) }}
        - root_cxx_standard ==${{ root_cxx_standard }}

    tests:
      - package_contents:
          files:
            - lib/cmake/Acts/ActsPluginRootTargets.cmake
            - lib/cmake/Acts/ActsPluginRootDependencies.cmake
          include:
            - ActsPlugins/Root/BlueprintBuilder.hpp
            - ActsPlugins/Root/TGeoDetectorElement.hpp
          lib:
            - ActsPluginRoot
      - files:
          recipe:
            - test-plugin-root/
        requirements:
          run:
            - ${{ compiler('cxx') }}
            - cmake
            - make
            - libboost-devel
            - eigen
        script:
          - cmake -S test-plugin-root -B test-build
          - cmake --build test-build
          - ./test-build/acts_plugin_root_test

about:
  homepage: https://acts.readthedocs.io/
  summary: |
    ACTS is an experiment-independent toolkit for (charged) particle track
    reconstruction in (high energy) physics experiments implemented in modern
    C++.
  description: |
    The ACTS project provides high-level track reconstruction modules that can
    be used for any tracking detector.
    The tracking detector geometry description is optimized for efficient
    navigation and fast extrapolation of tracks.
    Converters for several common geometry description packages are available.
    In addition to the algorithmic code, this project also provides an event data
    model for the description of track parameters and measurements.
  license: MPL-2.0
  license_file: LICENSE
  documentation: https://acts.readthedocs.io/
  repository: https://github.com/acts-project/acts

extra:
  feedstock-name: acts
  recipe-maintainers:
    - matthewfeickert
    - paulgessinger
